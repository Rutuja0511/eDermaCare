plugins {
    alias(libs.plugins.androidApplication)
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.example.edermacarelatestt'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.edermacarelatestt"
        minSdk 25
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.3.0'
    implementation 'androidx.annotation:annotation:1.3.0'
    implementation 'com.android.support:support-annotations:28.0.0'
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.firebase.database
    implementation libs.firebase.firestore
    implementation libs.firebase.auth
    implementation libs.firebase.storage
//    implementation files('src\\main\\res\\values\\jsoup-1.17.2.jar')
    implementation 'org.jsoup:jsoup:1.14.3'
//    implementation libs.firebase_auth
    implementation 'com.squareup.picasso:picasso:2.71828'

// Replace the existing line with fileTree() method
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'com.github.bumptech.glide:glide:4.12.0'
    implementation libs.navigation.runtime
    annotationProcessor 'com.github.bumptech.glide:compiler:4.12.0'

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation 'org.tensorflow:tensorflow-lite:2.5.0'
    implementation 'androidx.annotation:annotation:1.3.0'

}